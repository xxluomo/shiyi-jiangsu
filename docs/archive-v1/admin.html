<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>馆藏管理 · 拾遗</title><link rel="icon" href="/assets/seal.svg" type="image/svg+xml"><link rel="stylesheet" href="/style.css"><script src="/admin.js" defer></script></head><body class="admin-page"><header class="site-header"><a class="brand" href="/"><span class="seal">拾</span><span>拾遗<small>馆藏管理工作台</small></span></a><a class="header-link" href="/">返回数字文化馆 ↗</a></header><main class="admin-main"><section id="login-panel" class="login-panel"><div class="eyebrow">CURATOR ACCESS</div><h1>让好内容，<br>被更多人看见。</h1><p class="muted">登录后管理馆藏，查看答题统计。</p><form id="login-form"><label>管理员账号<input name="username" autocomplete="username" required maxlength="60" placeholder="输入账号"></label><label>密码<input name="password" type="password" autocomplete="current-password" required maxlength="256" placeholder="输入密码"></label><p id="login-error" class="error" role="alert"></p><button class="button" type="submit">登录工作台 →</button></form><p class="muted small">本地课程演示系统 · 账号请见项目使用说明</p></section><section id="dashboard" hidden><div class="section-heading"><div><div class="eyebrow">CURATOR DESK</div><h1>馆藏管理工作台</h1><p class="muted">更新故事与图片，让展馆保持鲜活。</p></div><div class="admin-actions"><span id="current-user"></span><button class="button secondary" id="logout">退出登录</button></div></div><div id="stats" class="stats-grid"></div><div class="section-heading admin-heading"><h2>展品与故事</h2><button class="button" id="new-item">＋ 新增项目</button></div><p id="admin-status" role="status" class="muted"></p><div class="table-wrap"><table class="admin-table"><thead><tr><th>项目</th><th>分类</th><th>地域</th><th>操作</th></tr></thead><tbody id="item-rows"></tbody></table></div><section class="recent-section"><h2>最近答题记录</h2><p class="muted small">时间为数据库UTC时间。只保存得分，不收集答题者身份。</p><div id="recent-attempts"></div></section></section></main><dialog id="edit-dialog" class="edit-dialog"><div class="dialog-top"><h2 id="edit-heading">新增馆藏</h2><button id="close-edit" class="icon-button" aria-label="关闭编辑">×</button></div><form id="item-form" class="item-form"><input name="id" type="hidden"><div class="form-grid"><label>项目名称<input name="title" required maxlength="60"></label><label>所属分类<select name="category"><option>传统美术</option><option>传统技艺</option></select></label><label>地域<input name="region" required maxlength="60" placeholder="江苏 · 无锡"></label><label>资料来源名称<input name="source_name" required maxlength="120"></label></div><label>简短介绍<textarea name="summary" rows="2" required maxlength="240"></textarea></label><label>详细故事<textarea name="content" rows="5" required maxlength="12000" placeholder="段落之间使用换行分隔"></textarea></label><label>工艺步骤（每行一项，1至10项）<textarea name="steps" rows="4" required></textarea></label><label>资料来源网址<input name="source_url" type="url" required maxlength="600" placeholder="https://..."></label><div class="form-grid image-fields"><label>展馆示意插画<select name="image" id="image-select"><option value="/assets/clay.svg">惠山泥人插画</option><option value="/assets/teapot.svg">紫砂壶插画</option><option value="/assets/embroidery.svg">刺绣插画</option><option value="/assets/bamboo.svg">竹刻插画</option></select></label><label>或上传自己的图片（不超过6MB）<input id="image-upload" type="file" accept="image/png,image/jpeg,image/gif,image/webp"></label></div><div class="image-preview"><img id="image-preview" src="/assets/clay.svg" alt="当前项目封面预览"><p id="upload-status" class="muted">配图需有使用权限，请在正文注明来源或原创身份。</p></div><p id="edit-error" class="error" role="alert"></p><div class="form-actions"><button class="button" id="save-item" type="submit">保存项目</button><button class="button secondary" id="cancel-edit" type="button">取消</button></div></form></dialog><dialog id="delete-dialog" class="confirm-dialog"><div class="eyebrow">删除确认</div><h2>删除这个项目？</h2><p id="delete-name"></p><p class="muted">删除后，前台将不再展示该项目。操作无法在页面中撤回。</p><p id="delete-error" class="error" role="alert"></p><div class="form-actions"><button id="confirm-delete" class="button danger">确认删除</button><button id="cancel-delete" class="button secondary">取消</button></div></dialog><div id="toast" class="toast" role="status" hidden></div></body></html>
